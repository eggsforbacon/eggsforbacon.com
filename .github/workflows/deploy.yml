name: Deploy to VPS (rsync + pm2)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure remote dir exists
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ secrets.REMOTE_DIR }}"

      - name: Sync files to server (rsync)
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='.next/cache' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_DIR }}

      - name: Remote install, build and reload pm2
        env:
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            set -e
            cd "$REMOTE_DIR" || { echo "ERROR: REMOTE_DIR not found: $REMOTE_DIR"; exit 1; }

            export NVM_DIR="\$HOME/.nvm"
            if [ -s "\$NVM_DIR/nvm.sh" ]; then
              . "\$NVM_DIR/nvm.sh"
              nvm use --lts || nvm install --lts
            fi

            npm ci
            npm run build

            if [ -f ecosystem.config.js ]; then
              pm2 reload ecosystem.config.js --env production || PORT=3027 pm2 start ecosystem.config.js --env production
            else
              pm2 reload "eggsforbacon.com" || PORT=3027 pm2 start npm --name "eggsforbacon.com" -- start
            fi

            pm2 save
          EOF
